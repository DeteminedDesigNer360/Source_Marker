# Source Markers 键位覆盖表（改完重启 mpv 生效）
# 语法： <动作名> = <按键>      没写的动作用默认；写 none 表示禁用这个键
# 按键写法与 mpv 一致：字母/数字原样；命名键用大写（ENTER / LEFT / DEL / ESC / F10 ...）；
#                       组合键写 Ctrl+e / Shift+m / Ctrl+Shift+m / Alt+m
# 也可以完全不用这个文件，改用 mpv 的 input.conf（优先级最高，会盖过本插件）：
#     <你的键>  script-binding source_markers/<动作名>

# —— 全局快捷键 ——
# add                      = Ctrl+m
# add-prompt               = Alt+m
# color-0                  = Ctrl+1
# color-1                  = Ctrl+2
# color-2                  = Ctrl+3
# color-3                  = Ctrl+4
# color-4                  = Ctrl+5
# color-5                  = Ctrl+6
# color-6                  = Ctrl+7
# color-7                  = Ctrl+8
# toggle-list              = Ctrl+l
# next                     = Alt+n
# prev                     = Alt+p
# goto-prompt              = Alt+g
# edit-nearest             = Alt+e
# delete-nearest           = Ctrl+DEL
# export-prompt            = Ctrl+e
# export-stamped           = Ctrl+Shift+e
# export-as                = Ctrl+Alt+e
# import-prompt            = Ctrl+i
# help                     = F1
# toggle-panel             = F2
# marker-mode              = F10

# —— 标记模式内（先按 F10 打开）——
# add                      = m
# next                     = Shift+m
# prev                     = Ctrl+Shift+m

# —— 编辑态内（标记模式里按 ENTER 进入）——
# edit-back1               = LEFT
# edit-fwd1                = RIGHT
# edit-back10              = SHIFT+LEFT
# edit-fwd10               = SHIFT+RIGHT
# edit-back1               = ,
# edit-fwd1                = .
# edit-back10              = [
# edit-fwd10               = ]
# edit-c0                  = 0
# edit-c1                  = 1
# edit-c2                  = 2
# edit-c3                  = 3
# edit-c4                  = 4
# edit-c5                  = 5
# edit-c6                  = 6
# edit-c7                  = 7
# edit-text-t              = t
# edit-text-enter          = ENTER
# del-current              = DEL
# edit-exit                = ESC
