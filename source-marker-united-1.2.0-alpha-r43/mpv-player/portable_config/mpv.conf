# Source Markers 便携版默认配置（只影响本包，不动你的 %APPDATA%\mpv）
#
# 想让改动生效：改完保存即可，mpv 下次启动读取。

# 精确跳转：跳到标记时帧精确（插件默认也会自行开启）
hr-seek=yes

# OSD：允许显示标记列表 / 提示（静音时可设 osd-level=1 减少打扰）
osd-level=2
osd-duration=2000

# 首次使用直接显示按钮面板（鼠标可点；F2 可关，关闭状态会被记住）
script-opts=source-markers-panel=yes

# 第 8 条：关掉 mpv 内置 OSC —— 底部整条让给插件自己的 OSD
# （F2 显示 / 隐藏；F3 在「按钮面板」和「Pr 风格控制栏」之间切换；选择会被记住）
# 关掉后 mpv 自带的进度条与按钮不再出现；seek 时那条进度线仍由 osd-bar 提供（默认仍开着）
osc=no

# 常用可选（按需取消注释）：
# hwdec=auto                 # 硬解（老显卡黑屏就改回 no）
# volume=80
# screenshot-directory=~~desktop
# sub-auto=fuzzy             # 自动加载同名外挂字幕
