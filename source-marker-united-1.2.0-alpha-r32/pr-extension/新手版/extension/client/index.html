<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Source Marker</title>
<script src="./CSInterface.js"></script>
<style>
  :root { --bg:#232323; --panel:#2d2d2d; --line:#3c3c3c; --fg:#d8d8d8; --dim:#8a8a8a; --accent:#4a9eff; }
  * { box-sizing:border-box; }
  /* 目标尺寸：400 宽 × 350 高（100% 缩放）。新手版字号/边距比完整版略大，
     但仍要保证三条：① 行能换行 ② 边距收紧 ③ 列表与日志高度收敛 */
  body { margin:0; padding:7px; background:var(--bg); color:var(--fg);
         font:12px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; }
  h1 { font-size:13px; margin:0 0 6px; font-weight:600; letter-spacing:.3px; color:#fff; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:7px; margin-bottom:6px; }
  section > h2 { font-size:12px; margin:0 0 5px; color:#fff; font-weight:600; }
  .row { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; margin-bottom:5px; }
  .row:last-child { margin-bottom:0; }
  /* 标签允许换行：r21 真机踩过 —— 长标签在 400 宽下不换行会把行撑破，出现横向滚动条。
     短标签（入/出/微调）不受影响。 */
  label { color:var(--dim); white-space:normal; }
  input[type=text], input[type=number], select {
    flex:1; min-width:0; background:#1c1c1c; color:var(--fg);
    border:1px solid var(--line); border-radius:3px; padding:3px 6px; font:inherit;
  }
  input.tc { flex:0 0 92px; font-family:Consolas,monospace; }
  input.num { flex:0 0 46px; }
  input.ms { flex:0 0 58px; }          /* 间隔框：固定宽，别被 flex:1 拉长 */
  button { background:#3a3a3a; color:var(--fg); border:1px solid var(--line);
           border-radius:3px; padding:4px 8px; font:inherit; cursor:pointer; white-space:nowrap; }
  button:hover { background:#454545; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#08121c; font-weight:600; }
  button.primary:hover { background:#67b0ff; }
  button.mini { padding:2px 7px; font-size:11px; }
  #clipName { font-weight:600; color:#fff; word-break:break-all; }
  #clipPath { color:var(--dim); font-size:11px; word-break:break-all; margin-bottom:3px; }
  /* 时间码那行文字长，窄面板下让它独占一行最稳 */
  #tcLine { font-family:Consolas,monospace; color:var(--accent); flex:1 1 100%; }
  .preview { flex:1; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #namePreview { color:#ffd479; font-family:Consolas,monospace; }
  #log { height:80px; overflow:auto; background:#1a1a1a; border:1px solid var(--line);
         border-radius:3px; padding:5px; font-family:Consolas,monospace; font-size:11px;
         white-space:pre-wrap; word-break:break-all; color:#b9b9b9; }
  .hint { color:var(--dim); font-size:11px; margin-top:3px; }
  .err { color:#ff8080; }
  .ok { color:#7ddc8a; }
  .mklist { max-height:96px; overflow:auto; margin-top:4px; }
  .mk { padding:2px 4px; border-radius:3px; cursor:pointer; font-family:Consolas,monospace;
        font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mk:hover { background:#3a3a3a; }
</style>
</head>
<body>
<h1>Source Marker · 源监视器助手</h1>

<section>
  <h2>当前打开在源监视器里的片段</h2>
  <div id="clipName">（源监视器是空的）</div>
  <div id="clipPath"></div>
  <div class="row">
    <span id="tcLine">入 —　出 —</span>
    <span style="flex:1"></span>
    <button id="btnOpenInPlayer" class="mini">用播放器打开</button>
    <button id="btnPlaySource" class="mini">播放源</button>
    <label style="font-size:11px;color:var(--dim);display:flex;align-items:center;gap:3px;cursor:pointer"><input id="autoRefresh" type="checkbox" checked/> 源状态</label>
    <input id="srcMs" class="ms" type="number" min="300" max="60000" step="500" title="源状态刷新间隔（毫秒，300–60000）"/>
    <span style="font-size:11px;color:var(--dim)">ms</span>
    <button id="btnRefresh" class="mini">刷新</button>
  </div>
</section>

<section>
  <h2>标记：查看 / 导入 / 导出</h2>
  <div class="row">
    <button id="btnPickMarkers" class="mini">选择文件…</button>
    <button id="btnAutoMarkers" class="mini">自动找标记</button>
    <span id="markerFile" class="preview">未选择</span>
  </div>
  <div class="row">
    <label><input id="clearFirst" type="checkbox"/> 导入前先清空已有标记</label>
<label title="勾上后导出名带时间戳，保留每一次的版本；不勾则覆盖同名文件"><input id="iterStamp" type="checkbox"/> 导出时另存为迭代（带时间戳）</label>
    <span style="flex:1"></span>
    <label style="font-size:11px;color:var(--dim);display:flex;align-items:center;gap:3px;cursor:pointer" title="标记列表自己的自动刷新开关：源状态那一路关掉，这里照样刷。"><input id="autoMk" type="checkbox" checked/> 标记列表</label>
    <input id="mkMs" class="ms" type="number" min="300" max="60000" step="500" title="标记列表刷新间隔（毫秒，300–60000）"/>
    <span style="font-size:11px;color:var(--dim)">ms</span>
    <button id="btnListMarkers" class="mini">刷新列表</button>
    <button id="btnExportMarkers" class="mini">导出到源目录</button>
    <button id="btnImport" class="primary">导入</button>
  </div>
  <div style="display:flex;gap:6px">
    <div style="flex:1 1 0;min-width:0">
      <div style="font-size:11px;color:var(--dim);margin:5px 0 2px">源里现有的标记 <span id="srcCount"></span></div>
      <div id="markerList" class="mklist"><div class="hint">（点列表里的标记可把播放头跳过去）</div></div>
    </div>
    <div style="flex:1 1 0;min-width:0">
      <div style="font-size:11px;color:var(--dim);margin:5px 0 2px">文件里的标记 <span id="fileCount"></span></div>
      <div id="fileMarkerList" class="mklist"><div class="hint">（选择文件后显示）</div></div>
    </div>
  </div>
  <div id="mkEditRow" class="row" style="display:none">
    <span class="hint" style="flex:0 0 auto;margin:0">改正文 <b id="mkEditLabel"></b></span>
    <input id="mkEditText" type="text" placeholder="标记正文"/>
    <button id="mkEditOk" class="mini">确定</button>
    <button id="mkEditCancel" class="mini">取消</button>
  </div>
  <div class="hint">源侧：单击选中并跳转 · 双击改正文 · 选中后按 Delete 删除（按两次确认）</div>
</section>

<section>
  <h2>源片段的入点 / 出点</h2>
  <div class="row">
    <label>入</label><input id="InTc" class="tc" type="text" placeholder="00:00:00:00"/>
    <label>出</label><input id="OutTc" class="tc" type="text" placeholder="00:00:00:00"/>
    <button id="btnApply" class="mini">应用</button>
  </div>
  <div class="row">
    <button id="btnSeekIn" class="mini" title="把源监视器的播放头移到入点。Pr 官方接口没有定位源监视器的能力，这里走 QE 通道。">跳到入点</button>
    <button id="btnSeekOut" class="mini" title="把源监视器的播放头移到出点。Pr 官方接口没有定位源监视器的能力，这里走 QE 通道。">跳到出点</button>
    <label>微调</label>
    <input id="nudge" class="num" type="number" value="1" min="1"/>
    <label>帧</label>
    <button id="inMinus" class="mini">入 −</button>
    <button id="inPlus" class="mini">入 ＋</button>
    <button id="outMinus" class="mini">出 −</button>
    <button id="outPlus" class="mini">出 ＋</button>
    <label style="font-size:11px;color:var(--dim);display:flex;align-items:center;gap:3px;cursor:pointer" title="微调后把播放头也移到新的入/出点。连按太快时 Pr 可能卡顿，可关掉。"><input id="followNudge" type="checkbox" checked/> 跟随</label>
  </div>
  <div class="row">
    <button id="btnClear" class="mini">清除源入点和出点</button>
  </div>
  <div class="hint">「跳到入点/出点」以及「微调」之后的播放头跟随，都靠 <b>QE 通道</b>定位源监视器 —— Pr 官方接口没有这个能力。</div>
</section>

<section>
  <h2>导出这一段</h2>
  <div class="row">
    <label>保存到</label>
    <input id="outDir" type="text" placeholder="点右侧按钮选一次，以后就记住了"/>
    <button id="btnPickOutDir" class="mini">选择…</button>
  </div>
  <div class="row">
    <label>输出格式</label>
    <input id="presetPath" type="text" placeholder="选一个 Media Encoder 预设（.epr）"/>
    <button id="btnPickPreset" class="mini">选择…</button>
  </div>
  <div class="row">
    <label>文件名</label>
    <span id="namePreview" class="preview">—</span>
  </div>
  <div class="row">
    <label><input id="runBatch" type="checkbox" checked/> 导出后自动开始渲染</label>
    <span style="flex:1"></span>
    <button id="btnExport" class="primary">导出这一段</button>
  </div>
</section>

<section>
  <h2>放到时间线</h2>
  <div class="row">
    <select id="sendMode"><option value="insert">插入</option><option value="overwrite">覆盖</option></select>
    <label>视频轨 V</label><input id="vIdx" class="num" type="number" value="1" min="1"/>
    <label>音频轨 A</label><input id="aIdx" class="num" type="number" value="1" min="1"/>
    <span style="flex:1"></span>
    <button id="btnSend" class="primary">放到时间线</button>
  </div>
</section>


<section>
  <h2>状态</h2>
  <div class="row">
    <button id="btnCopyLog" class="mini">复制状态信息</button>
    <button id="btnClearLog" class="mini">清空</button>
    <button id="btnCleanup" class="mini">清理导出产生的临时序列</button>
    <span id="copyHint" class="hint"></span>
  </div>
  <div id="log"></div>
</section>

<script src="./main.js"></script>
</body>
</html>
